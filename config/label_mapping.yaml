# IoT-23 label mapping to our 5 classes (proposal Table 5, guide Step 8).
#
# STATUS: DRAFT - NOT FROZEN.
# Freeze it only in Step 8, AFTER Step 7 has made the manifest (real label counts per
# scenario) and the team has read the official label descriptions. Then set mapping_status
# to "frozen", write the reasons in docs/decision_log.md, show the supervisor, and commit.
mapping_status: draft

# Key = the IoT-23 "detailed-label" text. Benign rows have label "Benign" and
# detailed-label "-", so the loader maps them by the "label" column.
# Value = one of the target classes below, or EXCLUDE (removed and counted).
mapping:
  # --- Fixed by proposal Table 5 ---
  Benign: Benign
  DDoS: DDoS_DoS
  PartOfAHorizontalPortScan: PortScan
  "C&C": CnC
  "C&C-HeartBeat": CnC
  "C&C-Torii": CnC
  Okiru: Malware_Download
  Mirai: Malware_Download          # listed in Table 5; check if it appears in the manifest
  FileDownload: Malware_Download

  # --- Mixed or unclear labels: TEAM DECIDES in Step 8 ---
  # Table 5: "attack labels that we checked are flooding" -> DDoS_DoS, otherwise EXCLUDE.
  # Table 5: "mixed labels we checked" -> Malware_Download.
  # Rule (Sections 2.3, 3.2): if a label is too general or unclear, do NOT force it. EXCLUDE it.
  Attack: TO_DECIDE                         # DDoS_DoS only if checked as flooding
  Okiru-Attack: TO_DECIDE                   # DDoS_DoS only if checked as flooding
  "C&C-HeartBeat-Attack": TO_DECIDE         # DDoS_DoS only if checked as flooding
  PartOfAHorizontalPortScan-Attack: TO_DECIDE
  "C&C-FileDownload": TO_DECIDE             # Malware_Download or CnC (main behaviour)
  "C&C-HeartBeat-FileDownload": TO_DECIDE   # Malware_Download or CnC (main behaviour)
  "C&C-Mirai": TO_DECIDE                    # CnC or Malware_Download (Table 5 lists Mirai under malware)
  "C&C-PartOfAHorizontalPortScan": TO_DECIDE  # CnC or PortScan (main behaviour)
  # Malicious rows with no detailed label: count them; suggested EXCLUDE.
  # Add any other label that the Step 7 manifest shows. Every label must have a decision.

target_classes:
  0: Benign
  1: DDoS_DoS
  2: PortScan
  3: CnC
  4: Malware_Download
