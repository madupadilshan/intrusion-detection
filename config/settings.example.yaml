# Lab settings (guide Step 4). Copy to config/settings.yaml for real use (not in Git).
# The IP addresses are EXAMPLES. Replace them with your own lab plan from Step 5.
# The lab must be a separate network: no university, home or public network.

lab:
  approved_scan_subnets: ["192.168.50.0/24"]  # Nmap may scan ONLY these (Section 3.7)
  local_networks: ["192.168.50.0/24"]         # the camera LAN: decides traffic direction, and these devices are never auto-blocked. Do NOT list the "outside" test network here.
  sensor_mirror_interface: "eth1"             # sensor port that receives the switch mirror (no IP)

allowlist:            # management IPs that are NEVER blocked (checked on the source IP)
  - 192.168.50.1      # lab router / gateway
  - 192.168.50.5      # IDS sensor
  - 192.168.50.10     # admin workstation
  - 192.168.50.20     # NVR

response:
  deployment_mode: passive      # passive is the default (Table 11); or inline
  adapter: router               # router (passive mode: the lab router blocks) | nftables (inline mode: the sensor blocks) | simulation (development only; nothing is blocked)
  auto_response: false          # master switch for automatic blocking; turn on only during planned lab tests
  min_confidence: 0.30          # floor for ANY automatic block (D-046: the lowest value a threshold can take); the per-class block thresholds from Step 17 decide
  min_repeats: 3                # an attack must repeat this many times inside the window before a block (proposal 3.4)
  repeat_window_seconds: 60     # the time window for min_repeats
  max_rule_minutes: 30          # every rule expires (maximum rule time)
  allow_device_isolation: false # isolate a local device only if the policy allows
  ddos_rate_limit: true         # D-055: rate-limit (not block) an outside DDoS source; false = DDoS alert only

firewall:                       # details for the adapter chosen in response.adapter
  table_name: ids               # nftables table name (sensor/ids_router.nft, sensor/ids_inline.nft)
  # table_family: inet          # optional; default is inet for router, bridge for nftables (inline)
  use_sudo: true
  # router_host / router_port / router_user / router_key_file may be set here,
  # or in .env as ROUTER_HOST / ROUTER_PORT / ROUTER_USER / ROUTER_KEY_FILE.

scanner:                        # device discovery (FR-05, proposal 3.7)
  # nmap_command: ["nmap"]      # default: the local Nmap; set a command to run Nmap elsewhere
  allow_simulation: false       # true only for software tests: then invented devices, marked SIMULATED

zeek:
  conn_log_path: /var/log/ids-zeek/conn.log  # Zeek is started in this folder (Step 19)
  # files_log_path: /var/log/ids-zeek/files.log  # file-type check (D-052); default: next to conn.log

model:
  bundle_path: ml_engine/models/ids_bundle_v3.joblib
  random_seed: 42

retention_days:   # filled in from agreed retention plan (Step 1)
  attack_events: 90
  traffic_summaries: 30
  system_logs: 90
